name: Bash validation

on:
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - '**.sh'
      - '.github/workflows/bash.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/bash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse Bash scripts
        run: bash -n claude-project-mover.sh tests/test-origin-manifest.sh tests/test-session-bundle.sh

      - name: Test origin manifest history
        run: bash tests/test-origin-manifest.sh

      - name: Test portable session bundle
        run: bash tests/test-session-bundle.sh
