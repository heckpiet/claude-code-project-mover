name: PowerShell validation

on:
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - '**.ps1'
      - '**.psm1'
      - 'VERSION'
      - '.github/workflows/powershell.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - 'VERSION'
      - '.github/workflows/powershell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse scripts
        shell: powershell
        run: |
          $scriptFiles = Get-ChildItem -Path . -Include '*.ps1', '*.psm1' -File -Recurse
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser found $($errors.Count) error(s) in $($scriptFile.Name)."
            }
          }

      - name: Check version consistency
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "VERSION '$version' is not a valid stable SemVer version."
          }
          $script = Get-Content -LiteralPath claude-project-mover.ps1 -Raw
          $match = [regex]::Match($script, "(?m)^\`$ScriptVersion = '([^']+)'\s*$")
          if (-not $match.Success) {
            throw 'Could not find $ScriptVersion in claude-project-mover.ps1.'
          }
          if ($match.Groups[1].Value -cne $version) {
            throw "VERSION is '$version' but claude-project-mover.ps1 contains '$($match.Groups[1].Value)'."
          }
          $readme = Get-Content -LiteralPath README.md -Raw
          if ($readme -notmatch "(?m)^Aktuelle Version: \*\*$([regex]::Escape($version))\*\*\s*$") {
            throw "README.md does not show current version '$version'."
          }

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = @(
            Get-ChildItem -Path . -Include '*.ps1', '*.psm1' -File -Recurse |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          )
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
            throw "PSScriptAnalyzer found $($issues.Count) error-level issue(s)."
          }

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse scripts
