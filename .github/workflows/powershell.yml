name: PowerShell validation

on:
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - '**.ps1'
      - '.github/workflows/powershell.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '.github/workflows/powershell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\claude-project-mover.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parser found $($errors.Count) error(s)."
          }

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = @(Invoke-ScriptAnalyzer -Path '.\claude-project-mover.ps1' -Severity Error)
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
            throw "PSScriptAnalyzer found $($issues.Count) error-level issue(s)."
          }

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
